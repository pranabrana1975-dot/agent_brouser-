name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit & Integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agentbrowser/package-lock.json
      - run: npm ci
        working-directory: agentbrowser
      - run: npm run test:unit
        working-directory: agentbrowser

  e2e:
    name: Playwright Chromium E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentbrowser/package-lock.json
      - run: npm ci
        working-directory: agentbrowser
      - run: npx playwright install --with-deps chromium
        working-directory: agentbrowser
      - run: npm run test:e2e
        working-directory: agentbrowser
        env:
          AGENT_BROWSER_REQUIRE_E2E: '1'
          AGENT_BROWSER_NO_SANDBOX: '1'
